name: Background UI verification

on:
  workflow_dispatch:
    inputs:
      selection:
        description: Repository-relative JSON list of exact UI selectors
        required: true
        default: Tests/Verification/ui-smoke.json
        type: string
  push:
    paths:
      - .github/workflows/background-ui-verification.yml
      - Scripts/run-selected-ui-verification.py
      - Tests/Verification/**

permissions:
  contents: read

concurrency:
  group: background-ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  selected-ui:
    # This VM owns its own desktop; unit-test outcomes cannot skip this job.
    runs-on: macos-15
    timeout-minutes: 150
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      UI_SELECTION: ${{ inputs.selection || 'Tests/Verification/ui-smoke.json' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - uses: jdx/mise-action@v2
      - name: Verify runner contracts
        run: python3 -m unittest discover -s Tests/Scripts -p test_background_ui_verification.py
      - name: Configure custom SQLite
        run: Scripts/configure-grdb.sh
      - name: Run compiled selection serially on the isolated desktop
        run: python3 Scripts/run-selected-ui-verification.py --selection "$UI_SELECTION" --output build/background-ui
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: background-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/background-ui/*.json
            build/background-ui/*.log
            build/background-ui/*.xcresult
          if-no-files-found: warn
          retention-days: 14
