name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.3"
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - name: Configure custom SQLite
        run: Scripts/configure-grdb.sh
      - name: Test scheme normalization
        run: python3 -m unittest discover -s Tests/Scripts
      - name: Verify generated project
        run: Scripts/check-project-drift.sh
      - name: Check Debug and Release signing settings
        run: Scripts/check-signing-settings.sh
      - name: Audit first-party network surface
        run: Scripts/check-network-surface.sh
      - name: Build and run unit tests
        run: >-
          xcodebuild test
          -project Trace.xcodeproj
          -scheme Trace
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          -only-testing:TraceCoreTests
          -only-testing:TraceAppTests
          -resultBundlePath build/TraceUnitTests.xcresult
          CODE_SIGNING_ALLOWED=NO
      - name: Save unit-test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trace-unit-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/TraceUnitTests.xcresult
          if-no-files-found: ignore
          retention-days: 14
      - name: Build benchmark CLI
        run: >-
          xcodebuild build
          -project Trace.xcodeproj
          -scheme TraceBench
          -configuration Release
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
      - name: Compile external client and refresh benchmark
        run: |
          xcodebuild build -project Trace.xcodeproj -scheme TraceExternalClientFixture -configuration Debug -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO
          xcodebuild build -project Trace.xcodeproj -scheme CodexRefreshBenchmark -configuration Release -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO
