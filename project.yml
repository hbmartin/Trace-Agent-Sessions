name: Trace
options:
  minimumXcodeGenVersion: 2.46.0
  postGenCommand: python3 Scripts/normalize-trace-scheme.py
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.3"
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
projectReferences:
  GRDBCustom:
    path: Vendor/GRDB.swift/GRDBCustom.xcodeproj
packages:
  Clocks:
    url: https://github.com/pointfreeco/swift-clocks
    exactVersion: 1.1.0
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.6
  CustomDump:
    url: https://github.com/pointfreeco/swift-custom-dump
    exactVersion: 1.7.0
  ConcurrencyExtras:
    url: https://github.com/pointfreeco/swift-concurrency-extras
    exactVersion: 1.4.1
  XCTestDynamicOverlay:
    url: https://github.com/pointfreeco/xctest-dynamic-overlay
    exactVersion: 1.11.0
settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: false
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: true
    DEAD_CODE_STRIPPING: true
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: true
targets:
  TraceCore:
    type: framework
    platform: macOS
    sources:
      - Sources/TraceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.haroldmartin.Trace.Core
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - package: Clocks
      - target: GRDBCustom/GRDBCustom

  Trace:
    type: application
    platform: macOS
    sources:
      - Sources/TraceApp
      - path: Resources
        buildPhase: resources
    info:
      path: Config/Trace-Info.plist
      properties:
        CFBundleDisplayName: Trace
        CFBundleName: Trace
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "15.0"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSSupportsAutomaticGraphicsSwitching: true
    entitlements:
      path: Config/Trace.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.haroldmartin.Trace
        PRODUCT_NAME: Trace
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: true
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false
    dependencies:
      - package: Clocks
      - target: TraceCore
        embed: true
      - target: GRDBCustom/GRDBCustom
        embed: true

  TraceBench:
    type: tool
    platform: macOS
    sources:
      - Sources/TraceBench
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.haroldmartin.Trace.Bench
        GENERATE_INFOPLIST_FILE: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path"
    dependencies:
      - target: TraceCore
      - target: GRDBCustom/GRDBCustom

  CodexRefreshBenchmark:
    type: tool
    platform: macOS
    sources:
      - Tests/Benchmarks/CodexRefreshBenchmark.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.haroldmartin.Trace.CodexRefreshBenchmark
        GENERATE_INFOPLIST_FILE: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path"
    dependencies:
      - target: TraceCore
      - target: GRDBCustom/GRDBCustom

  TraceExternalClientFixture:
    type: framework
    platform: macOS
    sources:
      - Tests/ExternalClientFixture/DiscoveryClient.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.haroldmartin.Trace.ExternalClientFixture
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: TraceCore

  TraceCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/TraceCoreTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.haroldmartin.Trace.CoreTests
        GENERATE_INFOPLIST_FILE: true
        ENABLE_HARDENED_RUNTIME: false
    dependencies:
      - package: Clocks
      - package: CustomDump
      - package: XCTestDynamicOverlay
        product: IssueReportingTestSupport
      - target: TraceCore
      - target: GRDBCustom/GRDBCustom

  TraceAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/TraceAppTests
      - path: Sources/TraceApp
        excludes: [TraceApp.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.haroldmartin.Trace.AppTests
        GENERATE_INFOPLIST_FILE: true
        ENABLE_HARDENED_RUNTIME: false
        TEST_HOST: ""
    dependencies:
      - target: TraceCore
      - target: GRDBCustom/GRDBCustom
      - package: Clocks
      - package: CustomDump
      - package: XCTestDynamicOverlay
        product: IssueReportingTestSupport

  TraceUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/TraceUITests
      - Tests/TraceUITestSupport
    entitlements:
      path: Config/TraceUITests.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.haroldmartin.Trace.UITests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Trace
        ENABLE_HARDENED_RUNTIME: false
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: true
    dependencies:
      - target: Trace

  TraceSnapshotTests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/TraceSnapshotTests
        excludes: [__Snapshots__]
      - path: Tests/TraceSnapshotTests/__Snapshots__
        type: folder
        buildPhase: resources
      - Tests/TraceUITestSupport
    entitlements:
      path: Config/TraceUITests.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.haroldmartin.Trace.SnapshotTests
        # Xcode's UI-test default aliases Testing to _Testing_Unavailable, but
        # SnapshotTesting exports Swift Testing types alongside its XCTest API.
        OTHER_SWIFT_FLAGS: ""
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Trace
        ENABLE_HARDENED_RUNTIME: false
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: true
    dependencies:
      - target: Trace
      - package: SnapshotTesting

  TracePerformanceTests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/TracePerformanceTests
    entitlements:
      path: Config/TraceUITests.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.haroldmartin.Trace.PerformanceTests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Trace
        ENABLE_HARDENED_RUNTIME: false
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: true
    dependencies:
      - target: Trace

schemes:
  Trace:
    build:
      targets:
        Trace: all
        TraceCoreTests: [test]
        TraceAppTests: [test]
        TraceUITests: [test]
      preActions:
        - name: Configure GRDB custom SQLite
          script: '"$PROJECT_DIR/Scripts/configure-grdb.sh"'
          settingsTarget: Trace
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: TraceCoreTests
          parallelizable: true
          randomExecutionOrder: true
        - name: TraceUITests
          parallelizable: false
        - name: TraceAppTests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  TraceBench:
    build:
      targets:
        TraceBench: all
      preActions:
        - name: Configure GRDB custom SQLite
          script: '"$PROJECT_DIR/Scripts/configure-grdb.sh"'
          settingsTarget: TraceBench
    run:
      config: Release
  CodexRefreshBenchmark:
    build:
      targets:
        CodexRefreshBenchmark: all
      preActions:
        - name: Configure GRDB custom SQLite
          script: '"$PROJECT_DIR/Scripts/configure-grdb.sh"'
          settingsTarget: CodexRefreshBenchmark
    run:
      config: Release
  TraceExternalClientFixture:
    build:
      targets:
        TraceExternalClientFixture: all
      preActions:
        - name: Configure GRDB custom SQLite
          script: '"$PROJECT_DIR/Scripts/configure-grdb.sh"'
          settingsTarget: TraceExternalClientFixture

  TraceSnapshots:
    build:
      targets:
        Trace: all
        TraceSnapshotTests: [test]
      preActions:
        - name: Configure GRDB custom SQLite
          script: '"$PROJECT_DIR/Scripts/configure-grdb.sh"'
          settingsTarget: Trace
    test:
      config: Debug
      environmentVariables:
        TRACE_SNAPSHOT_RECORD: "0"
        TRACE_SNAPSHOT_XCODE_VERSION: "$(XCODE_VERSION_ACTUAL)"
        TRACE_SNAPSHOT_XCODE_BUILD: "$(XCODE_PRODUCT_BUILD_VERSION)"
      targets:
        - name: TraceSnapshotTests
          parallelizable: false

  TraceSnapshotsRecord:
    build:
      targets:
        Trace: all
        TraceSnapshotTests: [test]
      preActions:
        - name: Configure GRDB custom SQLite
          script: '"$PROJECT_DIR/Scripts/configure-grdb.sh"'
          settingsTarget: Trace
    test:
      config: Debug
      environmentVariables:
        TRACE_SNAPSHOT_RECORD: "1"
        TRACE_SNAPSHOT_XCODE_VERSION: "$(XCODE_VERSION_ACTUAL)"
        TRACE_SNAPSHOT_XCODE_BUILD: "$(XCODE_PRODUCT_BUILD_VERSION)"
      targets:
        - name: TraceSnapshotTests
          parallelizable: false

  TracePerformance:
    build:
      targets:
        Trace: all
        TracePerformanceTests: [test]
      preActions:
        - name: Configure GRDB custom SQLite
          script: '"$PROJECT_DIR/Scripts/configure-grdb.sh"'
          settingsTarget: Trace
    test:
      config: Release
      gatherCoverageData: false
      targets:
        - name: TracePerformanceTests
          parallelizable: false
